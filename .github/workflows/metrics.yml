name: Metrics

on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"
      - ".github/scripts/languages.py"
      - ".github/scripts/profile_metrics.py"
      - ".github/scripts/visual_metrics.py"

permissions:
  contents: write

concurrency:
  group: github-metrics-main
  cancel-in-progress: false

jobs:
  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar card de linguagens por linhas adicionadas
        run: python .github/scripts/languages.py
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GH_USER: wolwerr
          LIMIT: "8"
          # Nomes e e-mails gravados nos commits históricos
          AUTHORS: wolwerr,ricardo@dtmm.com.br,ricardo luis machado,ricardo@ricardolm.net,Ricardo Machado
          AFFILIATION: owner

      - name: Gerar cards de contribuições e estatísticas
        run: python .github/scripts/profile_metrics.py
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GH_USER: wolwerr

      - name: Generate trophies, 3D calendar and footer
        run: python .github/scripts/visual_metrics.py
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GH_USER: wolwerr

      - name: Commitar os SVGs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/metrics/*.svg
          if git diff --cached --quiet; then
            echo "Sem mudanças no SVG."
            exit 0
          fi
          git commit -m "chore: atualiza métricas do perfil"
          for attempt in 1 2 3; do
            echo "Tentativa de publicação: $attempt"
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "SVG publicado com sucesso."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done
          echo "Falha ao publicar o SVG após 3 tentativas."
          exit 1
